[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-device-control"
version = "2.6.0b1"
description = "Black Diamond Hub app: lodge device controls (scenes, lights, blinds, heaters, fans) via Home Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk[ha]>=0.46,<1",
]

[project.urls]
Source = "https://github.com/blackdiamondhub/bdh-app-device-control"

[project.entry-points."blackdiamondhub.plugins"]
device_control = "device_control.plugin:spec"

[tool.setuptools.packages.find]
include = ["device_control", "device_control.*"]

[tool.setuptools.package-data]
device_control = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
